<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders · SuperSaaaS</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="wrap row">
        <a class="brand" href="/"><span class="mark">S</span> SuperSaaaS</a>
        <nav><a href="/">Pricing</a><a href="/orders.html">Orders</a></nav>
      </div>
    </header>
    <main class="wrap left" style="padding-top:32px">
      <h1>Orders</h1>
      <p class="lead">Paid orders and payment events recorded by this shop's server.</p>
      <table>
        <thead><tr><th>When</th><th>Event</th><th>Product</th><th>Amount</th><th>Receipt</th><th>Result</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">No orders yet.</td></tr></tbody>
      </table>
    </main>
    <script>
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      async function load() {
        try {
          const { events } = await (await fetch("/api/orders")).json();
          if (events.length)
            document.getElementById("rows").innerHTML = events
              .map((e) => `<tr><td>${esc(new Date(e.receivedAt).toLocaleTimeString())}</td><td><code>${esc(e.event)}</code></td><td>${esc(e.product)}</td><td>${esc(e.amountUsd)}</td><td>${esc(e.receiptId ? "#" + e.receiptId : "")}</td><td class="${e.status === "paid" || e.status === "ok" ? "good" : e.status.startsWith("rejected") ? "badtext" : ""}">${esc(e.status)}</td></tr>`)
              .join("");
        } catch {}
        setTimeout(load, 3000);
      }
      load();
    </script>
  </body>
</html>
